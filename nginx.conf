server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ------------------------------------------------------------------------
    # Compression — shave bytes off HTML/CSS/JS/SVG/JSON responses.
    # ------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------------------------------
    # Clean URLs — Docusaurus emits /path/index.html and /path.html. Resolve a
    # request against the file, the .html variant, then the directory, and
    # finally fall back to the generated 404 page.
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # ------------------------------------------------------------------------
    # Long-lived caching for fingerprinted build assets (hashed filenames).
    # ------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML should always be revalidated so deploys are picked up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
