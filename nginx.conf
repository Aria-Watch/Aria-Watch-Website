# ----------------------------------------------------------------------------
# Privacy-friendly access logs (GDPR data minimisation): the last part of the
# client IP is dropped before anything is written.
#   IPv4 203.0.113.42      -> 203.0.113.0
#   IPv6 2001:db8:85a3:... -> 2001:db8:85a3::
# (This file is included in nginx's http{} block, so map/log_format are valid.)
# ----------------------------------------------------------------------------
map $remote_addr $remote_addr_anon {
    ~^(?<ip4>\d+\.\d+\.\d+)\.\d+$          $ip4.0;
    ~^(?<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $ip6::;
    default                                 0.0.0.0;
}
log_format anonymized '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log /var/log/nginx/access.log anonymized;

    # Redirects keep relative to the incoming host/scheme (works behind proxies).
    absolute_redirect off;

    # ------------------------------------------------------------------------
    # Security & privacy headers.
    # ------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ------------------------------------------------------------------------
    # Compression.
    # ------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------------------------------
    # Old Docusaurus URLs -> new locations (keeps existing links and SEO).
    # ------------------------------------------------------------------------
    location = "/docs/Borino/PCB Assembly" { return 301 /docs/borino/pcb-assembly/; }
    location ^~ /blog/tags/                { return 301 /blog/; }
    location = /blog/atom.xml              { return 301 /blog/rss.xml; }

    # ------------------------------------------------------------------------
    # Pages: /about -> /about/index.html, then the generated 404 page.
    # ------------------------------------------------------------------------
    # (Caching uses `expires` rather than add_header, so the security headers
    # above are inherited by every location.)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        expires -1;    # HTML is always revalidated: deploys show up immediately
    }

    # Fingerprinted build assets (hashed file names): cache for a year.
    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    # Other static files (favicon, social image, robots.txt...).
    location ~* \.(?:ico|png|jpg|jpeg|webp|avif|svg|txt|xml)$ {
        expires 7d;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
